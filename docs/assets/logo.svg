<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="鲸察 dsh-jingcha">
  <title>鲸察 · dsh-jingcha</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee7c7"/>
      <stop offset="1" stop-color="#3aa7f0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- 雷达弧：正在“察” -->
  <path d="M96 44a22 22 0 0 1 0 30" fill="none" stroke="#3aa7f0" stroke-opacity=".60" stroke-width="6" stroke-linecap="round"/>
  <path d="M108 33a38 38 0 0 1 0 52" fill="none" stroke="#3aa7f0" stroke-opacity=".32" stroke-width="6" stroke-linecap="round"/>

  <!-- 鲸身 + 尾鳍 -->
  <path d="M16 82c0-17 18-30 43-30 14 0 25 4 33 11l18-13-5 20 5 19-18-12c-8 7-19 11-33 11-25 0-43-12-43-26z" fill="url(#body)"/>
  <circle cx="38" cy="74" r="3.6" fill="#0b1220"/>
  <!-- 喷气（红黄绿三点，呼应挂件） -->
  <circle cx="44" cy="34" r="5" fill="#2fbf71"/>
  <circle cx="58" cy="25" r="5" fill="#e2b93b"/>
  <circle cx="72" cy="33" r="5" fill="#e5484d"/>
  <!-- 水面 -->
  <path d="M18 100c8 6 18 6 26 0s18-6 26 0 18 6 26 0" fill="none" stroke="#7ee7c7" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
</svg>
